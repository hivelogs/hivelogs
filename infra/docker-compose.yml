# HiveLogs - Docker Compose (desenvolvimento local)
#
# Nesta fase, apenas o TimescaleDB está ativo.
# Os serviços de aplicação (api, web, worker, mcp) serão habilitados
# quando os projetos forem inicializados e os Dockerfiles forem adicionados.
#
# Uso:
#   cd infra
#   cp .env.example .env
#   docker compose up timescaledb -d

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: hivelogs-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TIMESCALEDB_USER:-hivelogs}
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-hivelogs}
      POSTGRES_DB: ${TIMESCALEDB_DB:-hivelogs}
    ports:
      - "${TIMESCALEDB_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALEDB_USER:-hivelogs} -d ${TIMESCALEDB_DB:-hivelogs}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hivelogs

